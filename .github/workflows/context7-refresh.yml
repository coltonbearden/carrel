name: context7-refresh

# Ask Context7 to re-index the library after the documentation it serves changes.
#
# Endpoint, method and body come from the published OpenAPI spec
# (https://context7.com/openapi.json, "Context7 Public API" 2.0.0):
#   POST https://context7.com/api/v1/refresh
#   bearerAuth; body {"libraryName": "/owner/repo"} (required), optional branch
#   200 -> {"message": "..."}; 401/403/404/429 carry no documented body
#
# Until CONTEXT7_API_KEY exists the job is green and skipped rather than red:
# HAS_KEY is decided at job level, and the only step is gated on it. Nothing to
# disable, no red runs sitting in the history of a repo that never asked for it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "plugins/**"
      # root-level markdown is indexed regardless of `folders`; these are the
      # two that context7.json does not exclude
      - "README.md"
      - "SECURITY.md"
      - "context7.json"
      - ".github/workflows/context7-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context7-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_KEY: ${{ secrets.CONTEXT7_API_KEY != '' }}
    steps:
      - name: Request a refresh
        if: env.HAS_KEY == 'true'
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          # `owner/repo` of wherever this runs — the repository has already moved
          # once (D-025), and a hardcoded name 404s forever after the next move
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(python3 -c 'import json, os; print(json.dumps({"libraryName": "/" + os.environ["REPOSITORY"]}))')
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-max-time 120 --retry-connrefused \
            -X POST https://context7.com/api/v1/refresh \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "HTTP $code"
          # Only `message`, the one field the published contract documents
          # (200 -> {"message": string}), is echoed. Not the raw body, and not an
          # `error` field either: an error from an authenticated endpoint is exactly
          # where a credential or an internal path ends up, GitHub masks only the
          # registered secret, and this log is public. The status code is enough to
          # act on — 401/403 is the key, 404 the library name, 429 a rate limit.
          python3 - "$code" <<'PY'
          import json, sys, pathlib
          code = sys.argv[1]
          try:
              body = json.loads(pathlib.Path("response.json").read_text())
          except Exception:
              print("response was not JSON")
              body = {}
          if code.startswith("2") and isinstance(body, dict) and "message" in body:
              print(f"message: {str(body['message'])[:200]}")
          sys.exit(0 if code.startswith("2") else 1)
          PY

      - name: No API key configured
        if: env.HAS_KEY != 'true'
        run: |
          echo "CONTEXT7_API_KEY is not set — skipping the refresh."
          echo "Context7 re-indexes on its own schedule; this workflow only asks it to hurry."
          echo "See docs/REPO_SETTINGS.md for the secret inventory."
