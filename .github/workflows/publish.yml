# Publishes carrel to PyPI via Trusted Publishing (OIDC — no API token), then
# attaches the Claude Desktop extension (carrel-<version>.mcpb) to the release.
# Fires when a GitHub Release is published. Requires the trusted-publisher
# entry on pypi.org (project: carrel · owner: coltonbearden · repo: carrel ·
# workflow: publish.yml · environment: pypi). Release steps: docs/RELEASING.md
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # every job resolves from uv.lock, never re-resolves — the same guard
  # test.yml carries; without it this was the one build allowed to drift
  UV_LOCKED: "1"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (verify tag ↔ product.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version-file: uv.lock
          # no cache: the release build must not restore what other workflows' jobs saved
          enable-cache: false
      - name: Release tag must equal v<product.json version>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("product.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match product.json version 'v$version'"
            exit 1
          fi
          grep -q "^## v$version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## v$version' entry"; exit 1; }
      - name: Release commit must be on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::release target $GITHUB_SHA is not reachable from main"; exit 1; }
      - name: Generated copies must match product.json
        run: |
          python3 scripts/sync_product.py
          git diff --exit-code   # the whole tree: every file the sync writes, including ones added later
      - name: Identity + marketplace tests
        run: uv run --group dev pytest -q tests/test_product_sync.py tests/test_marketplace.py
      - name: Build sdist + wheel from the locked toolchain
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv "${RUNNER_TEMP}/smoke"
          uv pip install --python "${RUNNER_TEMP}/smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/carrel" --version | tee /dev/stderr | grep -q "$(python3 -c 'import json; print(json.load(open("product.json"))["version"])')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/carrel/${{ github.ref_name }}/
    permissions:
      id-token: write   # the only job that can mint the OIDC token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  bundle:
    # The Claude Desktop extension from the tagged commit (D-030), packed and
    # validated by the locked MCPB CLI and started against that commit.
    name: bundle (Desktop extension)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version-file: uv.lock
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install the MCPB CLI from its lock
        run: npm ci --prefix packaging/mcpb --ignore-scripts --no-audit --no-fund
      - name: Validate and pack
        run: uv run python scripts/build_mcpb.py pack
      - name: Start the packed bundle against the tagged commit
        run: uv run python scripts/build_mcpb.py smoke build/mcpb/*.mcpb --runtime checkout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: build/mcpb/*.mcpb
          if-no-files-found: error
          retention-days: 7

  attach:
    # Only once PyPI has this version: the bundle names it, and Desktop's uv
    # installs it from there. The smoke step is that install, so a file that
    # cannot start is never attached.
    name: attach (Desktop extension)
    needs: [publish, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the only job that can change the release: it uploads one file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version-file: uv.lock
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: build/mcpb/
      # The bundle has no lock, and `uv run` refuses one under UV_LOCKED=1, so the
      # script starts the bundle without the lock flags this workflow sets. A
      # just-published version can take a minute to reach PyPI's index: it retries.
      - name: Start the bundle from PyPI, as Desktop does
        run: python3 scripts/build_mcpb.py smoke build/mcpb/*.mcpb --runtime pypi --retry-for 600
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # --clobber: a re-run of this job replaces its own earlier upload
        run: gh release upload "$TAG" build/mcpb/*.mcpb --clobber --repo "$GITHUB_REPOSITORY"
