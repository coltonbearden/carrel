# Publishes carrel to PyPI via Trusted Publishing (OIDC — no API token).
# Fires when a GitHub Release is published. Requires the trusted-publisher
# entry on pypi.org (project: carrel · owner: coltonbearden · repo: carrel ·
# workflow: publish.yml · environment: pypi). Release steps: docs/RELEASING.md
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (verify tag ↔ product.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Release tag must equal v<product.json version>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("product.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match product.json version 'v$version'"
            exit 1
          fi
          grep -q "^## v$version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## v$version' entry"; exit 1; }
      - name: Release commit must be on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::release target $GITHUB_SHA is not reachable from main"; exit 1; }
      - name: Generated copies must match product.json
        run: |
          python3 scripts/sync_product.py
          git diff --exit-code -- src/carrel/_product.py pyproject.toml .claude-plugin plugins CITATION.cff
      - name: Identity + marketplace tests
        run: uv run --group dev pytest -q tests/test_product_sync.py tests/test_marketplace.py
      - name: Build sdist + wheel from the locked toolchain
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv "${RUNNER_TEMP}/smoke"
          uv pip install --python "${RUNNER_TEMP}/smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/carrel" --version | tee /dev/stderr | grep -q "$(python3 -c 'import json; print(json.load(open("product.json"))["version"])')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/carrel/${{ github.ref_name }}/
    permissions:
      id-token: write   # the only job that can mint the OIDC token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true
