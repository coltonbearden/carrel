name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"   # every job resolves from uv.lock, never re-resolves

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      # all extras: mypy sees every optional import and sync_reference.py can load every command
      - run: uv sync --group dev --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github src tests scripts
      - name: ruff format --check
        run: uv run ruff format --check src tests scripts
      - name: mypy (strict)
        run: uv run mypy
      - name: product.json ↔ generated copies
        run: |
          uv run python scripts/sync_product.py
          git diff --exit-code -- src/carrel/_product.py pyproject.toml .claude-plugin plugins CITATION.cff
      - name: docs/REFERENCE.md ↔ CLI --help
        run: |
          uv run python scripts/sync_reference.py
          git diff --exit-code -- docs/REFERENCE.md

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install external tools (full-capability run)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pandoc poppler-utils qpdf ghostscript weasyprint \
            tesseract-ocr ocrmypdf imagemagick libimage-exiftool-perl \
            ffmpeg pngquant icoutils jq miller ripgrep espeak-ng gnupg

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --group dev --all-extras

      - name: Fixtures regenerate byte-identically
        run: |
          uv run python tests/fixtures/generate.py
          git diff --exit-code --stat -- tests/fixtures

      # Coverage floor: measured 86% on feat/v0.2.0 (604 tests, 2026-09-04);
      # floor = observed - 5, rounded down to a multiple of 5. Re-measure with
      # `uv run pytest --cov=carrel -q` before raising it.
      - name: Test suite (with coverage floor)
        run: uv run pytest --cov=carrel --cov-report=term-missing:skip-covered --cov-fail-under=80

      - name: CLI smoke
        run: |
          uv run carrel --version
          uv run carrel doctor
          uv run carrel pack src/carrel/core --tree-only --json > /dev/null

      - name: Build and install the wheel into a clean venv
        run: |
          uv build
          uv venv --python ${{ matrix.python }} "${RUNNER_TEMP}/smoke"
          uv pip install --python "${RUNNER_TEMP}/smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/carrel" --version
          "${RUNNER_TEMP}/smoke/bin/carrel" doctor --json > /dev/null

  test-minimal:
    # degradation guard: no optional binaries and no extras installed at all
    name: test-minimal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: Suite must pass via skips, never crashes
        run: uv run pytest
      - name: doctor reports missing tools without failing
        run: uv run carrel doctor

  test-minimal-macos:
    # same degradation guard on macOS; required check "test-minimal (macos)" (docs/REPO_SETTINGS.md)
    name: test-minimal (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: Suite must pass via skips, never crashes
        run: uv run pytest
      - name: doctor reports missing tools without failing
        run: uv run carrel doctor

  test-minimal-windows:
    # advisory until green for one release (BUILD_PLAN scope guard)
    name: test-minimal (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: Suite must pass via skips, never crashes
        run: uv run pytest
      - name: doctor reports missing tools without failing
        run: uv run carrel doctor
