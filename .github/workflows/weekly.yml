name: tests (weekly)

# Mondays 06:17 UTC, on main. `tests` itself runs on push and pull request only,
# so with nothing merged, main showed its last green run for eight days in
# 2026-10 while a test tied to the calendar failed on every branch (D-028).
#
# A workflow of its own, not a `schedule:` in test.yml: in a public repository
# GitHub disables a scheduled workflow after 60 days without repository
# activity, and test.yml reports the checks every pull request needs. Only this
# wrapper can be switched off that way; `gh workflow enable weekly.yml` restores it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml
