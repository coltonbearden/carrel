# Local guard rails — same checks CI runs. pre-commit is not a project
# dependency; install the hook once with `uv run --with pre-commit pre-commit
# install` (or `pipx install pre-commit`). Hooks run on staged files only.
#
# Two rules keep these hooks from fighting the repo:
#   - `tests/fixtures/` is generated byte-for-byte by `tests/fixtures/generate.py`
#     (CLAUDE.md). A whitespace hook that "fixes" a fixture is immediately undone
#     by the generator, and the gate step that diffs them starts failing.
#   - The ruff hooks are Python-only. Since ruff-pre-commit v0.14 their default
#     `types_or` includes `markdown`, so `ruff format` rewrites Python fences
#     inside docs — which silently mangles mkdocs' `--8<--` snippet directives.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/
      - id: check-yaml
        # mkdocs.yml uses mkdocs-material's `!relative` tag, which has no
        # constructor in safe-load. --unsafe still parses for syntax errors.
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/carrel)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/carrel/.*\.py|pyproject\.toml)$
      - id: product-sync
        name: product.json ↔ generated copies
        entry: uv run pytest -q tests/test_product_sync.py
        language: system
        pass_filenames: false
        files: ^(product\.json|pyproject\.toml|CITATION\.cff|CHANGELOG\.md|src/carrel/_product\.py|\.claude-plugin/.*|plugins/.*/plugin\.json)$
