# Local guard rails. These hooks are a **superset** of the `lint` CI job, and CI
# does not run pre-commit at all — end-of-file-fixer, the trailing-whitespace,
# check-* and merge-conflict hooks have no CI counterpart, and `ruff-check` here
# runs `--fix` where CI runs read-only. Install the hook once with
# `uv run --with pre-commit pre-commit install` (pre-commit is not a project
# dependency), or `pipx install pre-commit`. Hooks run on staged files only.
#
# Two rules keep these hooks from fighting the repo:
#   - Everything under `tests/fixtures/` except `generate.py` is generated
#     byte-for-byte by that script (CLAUDE.md). A hook that "fixes" a fixture is
#     undone on the next run, and the gate step that diffs them starts failing.
#     `generate.py` itself is hand-written and stays covered.
#   - `ruff-format` must not see Markdown. Since ruff-pre-commit v0.14 its
#     upstream `types_or` includes `markdown`, and formatting a Python fence
#     rewrites mkdocs' `--8<--` snippet directives. The root-cause guard is
#     `extend-exclude = ["**/*.md"]` in pyproject.toml, which governs every ruff
#     invocation; the pin here is the second line of defence. (`ruff-check`'s
#     upstream types_or does *not* include markdown — its pin is belt-and-braces
#     against a future upstream change.)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/(?!generate\.py$)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/(?!generate\.py$)
      # Strict everywhere: safe-load also catches duplicate keys, which is the
      # classic merge-conflict aftermath in a workflow file.
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      # mkdocs.yml only: mkdocs-material's `!relative` tag has no safe-load
      # constructor. --unsafe parses for syntax but stops checking duplicate
      # keys, so it is scoped to the one file that needs it.
      - id: check-yaml
        name: check yaml (mkdocs, syntax only)
        args: [--unsafe]
        files: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter]
        exclude: ^tests/fixtures/(?!generate\.py$)
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^tests/fixtures/(?!generate\.py$)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/carrel)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/carrel/.*\.py|pyproject\.toml)$
      - id: product-sync
        name: product.json ↔ generated copies
        entry: uv run pytest -q tests/test_product_sync.py
        language: system
        pass_filenames: false
        files: ^(product\.json|pyproject\.toml|CITATION\.cff|CHANGELOG\.md|context7\.json|src/carrel/_product\.py|\.claude-plugin/.*|plugins/.*/plugin\.json)$
      - id: uv-lock-current
        name: uv.lock ↔ pyproject
        # Read-only on purpose: `uv run` and `uv sync` relock silently, so any
        # check reached *through* them repairs the staleness it should report.
        # That includes running pre-commit itself as `uv run pre-commit …`, which
        # is why the gate in CLAUDE.md cannot catch this and CI has to: CI syncs
        # with UV_LOCKED=1, where a stale lock fails every job in seconds before
        # a test runs. v0.5.0's first push did exactly that. Invoke this hook via
        # a real git hook or `uvx pre-commit` to see it fire.
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|product\.json)$
