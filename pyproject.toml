[project]
name = "carrel"
version = "0.2.0"
description = "A library desk for your files — and your agents. Local file toolkit for pdf, docx/odt/epub/rtf, xlsx, md/html/txt, json/xml/csv and images: convert, OCR, inspect, index, search, pack for LLM context (by query or git history), catalog, watch, and more — with an MCP server and a built-in Claude Code plugin marketplace."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Colton Bearden" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pypdf>=5.0",
    "pillow>=10.0",
    "reportlab>=4.0",
    "watchdog>=4.0",
    "markdown-it-py>=3.0",
]

# Optional extras (D-007). Each gated feature exits 3 with the extra's name
# when its package is absent — exactly like a missing binary.
[project.optional-dependencies]
tui = ["textual>=1.0"]          # carrel desk
office = ["openpyxl>=3.1"]      # xlsx text extraction (spec 18)
tokens = ["tiktoken>=0.8"]      # exact token counts for pack
all = ["textual>=1.0", "openpyxl>=3.1", "tiktoken>=0.8"]

[project.urls]
Homepage = "https://coltonbearden.github.io/carrel/"
Documentation = "https://coltonbearden.github.io/carrel/"
Repository = "https://github.com/coltonbearden/carrel"
Changelog = "https://github.com/coltonbearden/carrel/blob/main/CHANGELOG.md"
Issues = "https://github.com/coltonbearden/carrel/issues"

[project.scripts]
carrel = "carrel.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.16", "mypy>=1.14"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrel"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what `pip install` and the test suite need — not the docs
# site, demo tapes, brand assets, specs, or the plugin marketplace.
only-include = ["src", "tests", "product.json", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = [
    "tests/fixtures/*.pdf", "tests/fixtures/*.png", "tests/fixtures/*.jpg", "tests/fixtures/*.ico",
    "tests/fixtures/*.docx", "tests/fixtures/*.odt", "tests/fixtures/*.epub", "tests/fixtures/*.xlsx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["site", "snippets", "src/carrel/_product.py"]  # _product.py is generated by scripts/sync_product.py

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # bugbear
    "BLE",             # blind except
    "S",               # bandit
    "DTZ",             # naive datetimes
    "PIE", "PL", "RUF", "ISC", "SIM", "N", "ANN", "C4", "T20",
]
ignore = [
    "ANN401",   # Any is fine in generic helpers (emit/human callbacks)
    "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR2004",  # CLI commands are wide by nature
    "S603", "S607",  # every subprocess call goes through adapters.run (paths resolved by shutil.which)
    "E501",     # line length is enforced by the formatter
    "T201",     # click.echo/print are the product; rich fallbacks use print
    "ISC001",   # conflicts with the formatter
    "PLR0917",  # positional-argument counts: click passes options positionally
    "PLW2901",  # rebinding a loop variable while normalising it is idiomatic here
    "S314",     # xml.etree parses the user's own local files; defusedxml adds a dep for no gain
    "DTZ001", "DTZ006", "DTZ011",  # file mtimes / stamps are shown in local wall-clock time on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLC0415", "S108", "S106", "S105", "S110", "SIM115", "PLW1510"]
"tests/fixtures/generate.py" = ["S101", "ANN"]
"scripts/**" = ["T20", "S", "PLC0415"]
"src/carrel/commands/watch.py" = ["S602", "S404"]
"src/carrel/desk/app.py" = ["PLC0415"]
"src/carrel/commands/*.py" = ["PLC0415"]   # lazy imports keep `--help` fast (see cli.py)
"src/carrel/core/*.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["carrel"]

[tool.mypy]
python_version = "3.12"
files = ["src/carrel"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false   # sqlite3 rows / pypdf objects are Any by nature
warn_unreachable = true
# untyped third-party surfaces (click callbacks, textual widgets, pypdf objects)
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_any_generics = false
